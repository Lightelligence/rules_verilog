stages:
  - test

default:
  interruptible: true
  timeout: 30m
  tags:
    - sh-grun
  before_script:
    - source env.sh
    - module list

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GIT_DEPTH: "1"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1

yapf-format:
  stage: test
  timeout: 10m
  script:
    - 'python -m yapf --version || { echo "yapf is not installed on this runner (CI is offline; project pin is requirements-format.txt)"; exit 1; }'
    - python -m yapf --diff --recursive bin lib tests > yapf.patch || true
    - 'if [ -s yapf.patch ]; then cat yapf.patch; exit 1; fi'
  artifacts:
    when: on_failure
    paths:
      - yapf.patch
    expire_in: 1 week

doc-check:
  stage: test
  timeout: 10m
  script:
    - bash ./tests/doc_test.sh

# Disabled: the runner's glibc is too old to start Bazel 7.7.1. Rename back to
# 'redhat-no-license' once a suitable runner is available.
.redhat-no-license:
  stage: test
  script:
    - ./tests/redhat_smoke.sh
